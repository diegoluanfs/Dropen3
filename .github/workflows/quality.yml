name: Tests
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test]'
      - run: python -m compileall -q src
      - run: python -m pytest -q

      - name: Scientific core coverage gate
        run: >-
          python -m pytest -q
          tests/test_combined_science.py
          tests/test_combined_processing.py
          tests/test_combined_plots_export.py
          --cov=dropen3.science.combined
          --cov=dropen3.analysis.combined_core
          --cov=dropen3.analysis.combined_plotting
          --cov-report=term-missing
          --cov-fail-under=90
