[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dropen3"
version = "1.1.0.dev5"
description = "Open-source scientific software for contact angle and droplet impact analysis"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [
  {name = "Lucas Luis Bergonzi Barcellos"},
  {name = "Diego Luan Ferreira da Silva"},
  {name = "Daniel Eduardo Weibel"},
  {name = "Carlo Antonini"},
  {name = "Marcos Jose Leite Santos"},
]
keywords = ["contact angle", "wettability", "droplet impact", "scientific imaging"]
classifiers = [
 "Programming Language :: Python :: 3", "Operating System :: Microsoft :: Windows",
 "Topic :: Scientific/Engineering :: Physics", "Development Status :: 3 - Alpha",
]
dependencies = [
 "numpy>=1.26,<3", "opencv-python>=4.8,<5", "scipy>=1.12,<2",
 "pandas>=2.1,<3", "matplotlib>=3.8,<4", "Pillow>=10,<13",
 "customtkinter>=5.2,<6", "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
build = ["pyinstaller>=6,<7"]

[project.scripts]
dropen3 = "dropen3.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dropen3.assets" = ["logo.png", "dropen3.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
